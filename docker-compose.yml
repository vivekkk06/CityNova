name: citynova

services:
  # ==============================================================================
  # 1. CityNova Web Application (Next.js 16 + Prisma)
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DATABASE_URL=${DATABASE_URL}
    container_name: citynova-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Persistent local storage for citizen uploads (audio notes & incident photos)
      - app_uploads:/app/public/uploads
    networks:
      - citynova-network

  # ==============================================================================
  # 2. PostgreSQL with PostGIS Spatial Extensions
  # ==============================================================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: citynova-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citynova} -d ${POSTGRES_DB:-citynova_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - citynova-network

# ==============================================================================
# Volumes & Networks
# ==============================================================================
volumes:
  pgdata:
    name: citynova_pgdata
  app_uploads:
    name: citynova_uploads

networks:
  citynova-network:
    name: citynova-network
    driver: bridge
